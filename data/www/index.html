<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Ink Frame — Upload</title>
<!--
  Captive-portal frontend for the 7.3" 6-color E-Ink photo frame.

  Architecture: the frame's firmware does the dithering. This page only has to
  deliver a JPEG at the panel's NATIVE resolution (800x480). So we crop+resize
  every selected photo to exactly 800x480 in the browser (cover fit) and POST
  the resulting JPEG to /api/upload, where the firmware stores it under /img and
  registers it in playlist.json.

  Everything is inlined (no CDNs): the captive portal has no internet access.
-->
<style>
  :root{
    --bg:#f4f4f2; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b;
    --line:#d9d9d6; --accent:#1769ff; --ok:#1f9d55; --err:#d23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width:560px; margin:0 auto;
  }
  header{padding:24px 0 12px}
  h1{font-size:1.35rem; margin:0 0 4px}
  .sub{color:var(--muted); font-size:.9rem}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-top:16px;
  }
  .drop{
    border:2px dashed var(--line); border-radius:12px; padding:28px 16px;
    text-align:center; color:var(--muted); cursor:pointer; transition:.15s;
  }
  .drop.drag{border-color:var(--accent); color:var(--ink); background:#eef4ff}
  .drop strong{color:var(--ink)}
  input[type=file]{display:none}
  .btn{
    display:inline-block; width:100%; border:0; border-radius:12px;
    background:var(--accent); color:#fff; font-size:1rem; font-weight:600;
    padding:14px; margin-top:14px; cursor:pointer;
  }
  .btn[disabled]{opacity:.5; cursor:default}
  .queue{list-style:none; margin:14px 0 0; padding:0}
  .item{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .thumb{width:80px; height:48px; border-radius:6px; object-fit:cover; background:#eee; flex:0 0 auto; border:1px solid var(--line)}
  .meta{flex:1 1 auto; min-width:0}
  .name{font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bar{height:6px; background:#eee; border-radius:4px; overflow:hidden; margin-top:6px}
  .bar > i{display:block; height:100%; width:0; background:var(--accent); transition:width .2s}
  .status{font-size:.78rem; color:var(--muted); margin-top:4px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .summary{margin-top:12px; text-align:center; font-weight:600; font-size:.95rem; color:var(--muted)}
  .summary.ok{color:var(--ok)} .summary.err{color:var(--err)}
  .btn.ghost{background:#fff; color:var(--accent); border:1px solid var(--accent)}
  .tabs{display:flex; gap:8px; margin-top:16px}
  .tab{flex:1; padding:10px; border:1px solid var(--line); background:var(--card);
       border-radius:10px; font-weight:600; color:var(--muted); cursor:pointer}
  .tab.active{color:var(--ink); border-color:var(--accent)}
  .manage-bar{display:flex; gap:8px; margin-bottom:10px}
  .btn.small{width:auto; flex:0 0 auto; margin-top:0; padding:8px 12px; font-size:.85rem}
  .btn.danger{background:var(--err)}
  .btn.ghost.danger{background:#fff; color:var(--err); border:1px solid var(--err)}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .cell{position:relative; aspect-ratio:5/3; border:2px solid var(--line);
        border-radius:10px; overflow:hidden; background:#eee; cursor:pointer}
  .cell img{width:100%; height:100%; object-fit:cover; display:block}
  .cell.sel{border-color:var(--accent)}
  .cell .check{position:absolute; top:6px; right:6px; width:24px; height:24px;
        border-radius:50%; background:rgba(255,255,255,.85); border:1px solid var(--line);
        display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent}
  .cell.sel .check{background:var(--accent); color:#fff; border-color:var(--accent)}
  .empty{color:var(--muted); text-align:center; padding:24px 0}
  footer{color:var(--muted); font-size:.78rem; text-align:center; margin-top:22px}
</style>
</head>
<body>
<header>
  <h1>E-Ink Photo Frame</h1>
  <div class="sub">Add photos — they're auto-fitted to 800×480 and sent to the frame.</div>
</header>

<nav class="tabs">
  <button class="tab active" id="tabUpload">Upload</button>
  <button class="tab" id="tabManage">Manage</button>
</nav>

<section id="panelUpload">
<div class="card">
  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" multiple>
    <div>📷 <strong>Tap to choose photos</strong><br>or drag &amp; drop here</div>
  </label>
  <ul class="queue" id="queue"></ul>
  <button class="btn" id="send" disabled>Send to frame</button>
  <div class="summary" id="summary" hidden></div>
  <button class="btn ghost" id="show" hidden>Show newest on frame</button>
</div>
</section>

<section id="panelManage" hidden>
<div class="card">
  <div class="manage-bar">
    <button class="btn small ghost" id="selectAll">Select all</button>
    <button class="btn small ghost" id="refreshList">Refresh</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No photos on the frame yet.</div>
  <button class="btn danger" id="delSelected" disabled>Delete selected</button>
  <button class="btn ghost danger" id="delAll" hidden>Delete all photos</button>
</div>
</section>

<footer>
  Connected to the frame's Wi-Fi. Keep this page open until uploads finish,
  then tap the frame to show the next photo.
</footer>

<script>
"use strict";
const W = 800, H = 480, JPEG_QUALITY = 0.9;
const fileInput = document.getElementById('file');
const drop = document.getElementById('drop');
const queueEl = document.getElementById('queue');
const sendBtn = document.getElementById('send');
const summaryEl = document.getElementById('summary');
const showBtn = document.getElementById('show');

// Pending items: { blob, name, barFill, statusEl, done, failed }
let items = [];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// Crop+resize a photo to exactly 800x480 (cover fit) -> JPEG Blob.
// Prefer createImageBitmap: it decodes/downscales without ever painting the
// full-resolution image onto a canvas, and we close() the big bitmap right away.
// The old Image+canvas path makes iOS Safari run out of RAM on ~12MP gallery
// photos and silently kill the page (and the upload), while small screenshots
// survive. We fall back to that legacy path only if createImageBitmap is missing.
function processFile(file){
  if (typeof createImageBitmap === 'function'){
    return processWithBitmap(file).catch(() => processWithImage(file));
  }
  return processWithImage(file);
}

async function processWithBitmap(file){
  // First decode just to read the source dimensions. ImageBitmap is GPU-backed
  // and freed immediately via close(), so peak memory stays low.
  const src = await createImageBitmap(file);
  const scale = Math.max(W / src.width, H / src.height);
  // Source rectangle that, scaled by `scale`, exactly covers 800x480 (center crop).
  const sw = Math.min(src.width,  Math.round(W / scale));
  const sh = Math.min(src.height, Math.round(H / scale));
  const sx = Math.max(0, Math.round((src.width  - sw) / 2));
  const sy = Math.max(0, Math.round((src.height - sh) / 2));
  // Second decode: crop to that rect AND downscale toward 800x480 in one step.
  const fit = await createImageBitmap(src, sx, sy, sw, sh, {
    resizeWidth: W, resizeHeight: H, resizeQuality: 'high'
  });
  src.close(); // release the full-resolution bitmap now
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  // Draw with explicit 800x480 dest so output is correct even on browsers that
  // ignore the resize options above.
  ctx.drawImage(fit, 0, 0, W, H);
  fit.close();
  return await new Promise((resolve, reject) =>
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('encode failed')),
                  'image/jpeg', JPEG_QUALITY));
}

function processWithImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
      // cover fit: scale so the image fills 800x480, center-crop the overflow
      const scale = Math.max(W / img.width, H / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('encode failed')), 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = () => reject(new Error('not an image'));
    img.src = URL.createObjectURL(file);
  });
}

async function addFiles(fileList){
  for (const f of fileList){
    if (!f.type.startsWith('image/')) continue;
    const id = uid();
    let blob;
    try { blob = await processFile(f); }
    catch(e){ continue; }

    const row = document.createElement('li');
    row.className = 'item';
    row.innerHTML =
      '<img class="thumb">' +
      '<div class="meta">' +
        '<div class="name"></div>' +
        '<div class="bar"><i></i></div>' +
        '<div class="status">ready</div>' +
      '</div>';
    const thumb = row.querySelector('.thumb');
    thumb.src = URL.createObjectURL(blob);
    row.querySelector('.name').textContent = f.name || (id + '.jpg');
    queueEl.appendChild(row);

    items.push({
      blob, name: 'img_' + id + '.jpg',
      barFill: row.querySelector('.bar > i'),
      statusEl: row.querySelector('.status'),
      done: false, failed: false
    });
  }
  sendBtn.disabled = items.every(i => i.done) || items.length === 0;
}

function uploadOne(item){
  return new Promise((resolve) => {
    const fd = new FormData();
    fd.append('file', item.blob, item.name);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable){
        const pct = Math.round(e.loaded / e.total * 100);
        item.barFill.style.width = pct + '%';
        item.statusEl.textContent = 'uploading ' + pct + '%';
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300){
        item.barFill.style.width = '100%';
        item.statusEl.textContent = 'on the frame ✓';
        item.statusEl.className = 'status ok';
        item.done = true; item.failed = false;
      } else {
        item.statusEl.textContent = 'failed (HTTP ' + xhr.status + ')';
        item.statusEl.className = 'status err';
        item.failed = true;
      }
      resolve();
    };
    xhr.onerror = () => {
      item.statusEl.textContent = 'failed (network)';
      item.statusEl.className = 'status err';
      item.failed = true;
      resolve();
    };
    xhr.send(fd);
  });
}

async function sendAll(){
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending…';
  // Sequential: the frame writes to flash one chunk at a time; don't flood it.
  for (const item of items){
    if (!item.done) await uploadOne(item);
    refreshSummary();
  }
  sendBtn.textContent = 'Send to frame';
  sendBtn.disabled = items.every(i => i.done);
  refreshSummary();
}

// Unmistakable overall result + reveal the optional "Show newest" button once at
// least one photo is safely on the frame. Uploading never refreshes the frame on
// its own; the button below is the only thing that does, and only when tapped.
function refreshSummary(){
  const total = items.length;
  const ok = items.filter(i => i.done).length;
  const failed = items.filter(i => i.failed).length;
  if (total === 0 || (ok === 0 && failed === 0)){ summaryEl.hidden = true; showBtn.hidden = true; return; }
  summaryEl.hidden = false;
  summaryEl.textContent = ok + ' of ' + total + ' photo' + (total === 1 ? '' : 's') +
                          ' on the frame ✓' + (failed ? '  ·  ' + failed + ' failed' : '');
  summaryEl.className = 'summary ' + (failed ? 'err' : (ok === total ? 'ok' : ''));
  showBtn.hidden = ok === 0;
}

showBtn.addEventListener('click', () => {
  showBtn.disabled = true;
  showBtn.textContent = 'Updating the frame…';
  // The frame reboots to display the newest photo, which drops this connection,
  // so the request usually never resolves — that's expected, ignore any error.
  fetch('/api/done').catch(() => {});
});

fileInput.addEventListener('change', () => addFiles(fileInput.files));
sendBtn.addEventListener('click', sendAll);

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer) addFiles(e.dataTransfer.files); });

// ---- Manage tab: view + multi-select delete of photos already on the frame ----
const tabUpload = document.getElementById('tabUpload');
const tabManage = document.getElementById('tabManage');
const panelUpload = document.getElementById('panelUpload');
const panelManage = document.getElementById('panelManage');
const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const selectAllBtn = document.getElementById('selectAll');
const refreshBtn = document.getElementById('refreshList');
const delSelectedBtn = document.getElementById('delSelected');
const delAllBtn = document.getElementById('delAll');
const selected = new Set();

function showTab(manage){
  tabManage.classList.toggle('active', manage);
  tabUpload.classList.toggle('active', !manage);
  panelManage.hidden = !manage;
  panelUpload.hidden = manage;
  if (manage) loadList();
}
tabUpload.addEventListener('click', () => showTab(false));
tabManage.addEventListener('click', () => showTab(true));

function updateDeleteBar(){
  const n = selected.size;
  delSelectedBtn.disabled = n === 0;
  delSelectedBtn.textContent = n ? 'Delete selected (' + n + ')' : 'Delete selected';
}

async function loadList(){
  grid.innerHTML = '';
  selected.clear();
  updateDeleteBar();
  let files = [];
  try {
    const r = await fetch('/api/list');
    files = await r.json();
  } catch(e){ /* show empty state below */ }
  emptyEl.hidden = files.length > 0;
  delAllBtn.hidden = files.length === 0;
  for (const path of files){
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.path = path;
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = path; // served from LittleFS under /img
    const check = document.createElement('div');
    check.className = 'check';
    check.textContent = '✓';
    cell.appendChild(img);
    cell.appendChild(check);
    cell.addEventListener('click', () => {
      if (selected.has(path)) selected.delete(path); else selected.add(path);
      cell.classList.toggle('sel', selected.has(path));
      updateDeleteBar();
    });
    grid.appendChild(cell);
  }
}

selectAllBtn.addEventListener('click', () => {
  const cells = [...grid.children];
  const selectEverything = selected.size !== cells.length;
  selected.clear();
  cells.forEach(cell => {
    if (selectEverything){ selected.add(cell.dataset.path); cell.classList.add('sel'); }
    else cell.classList.remove('sel');
  });
  updateDeleteBar();
});

refreshBtn.addEventListener('click', loadList);

async function deletePaths(paths){
  delSelectedBtn.disabled = true; delAllBtn.disabled = true;
  for (const path of paths){
    // One request per photo keeps the firmware endpoint trivial. Ignore individual
    // failures; the list reload afterwards reflects what's actually on the frame.
    try { await fetch('/api/delete?file=' + encodeURIComponent(path), { method: 'POST' }); }
    catch(e){ /* ignore */ }
  }
  delAllBtn.disabled = false;
  await loadList();
}

delSelectedBtn.addEventListener('click', () => {
  const n = selected.size;
  if (!n) return;
  if (!confirm('Delete ' + n + ' photo' + (n === 1 ? '' : 's') + ' from the frame?')) return;
  deletePaths([...selected]);
});

delAllBtn.addEventListener('click', () => {
  const all = [...grid.children].map(c => c.dataset.path);
  if (!all.length) return;
  if (!confirm('Delete ALL ' + all.length + ' photos from the frame? This cannot be undone.')) return;
  deletePaths(all);
});
</script>
</body>
</html>
